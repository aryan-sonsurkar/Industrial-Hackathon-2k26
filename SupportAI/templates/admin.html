<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportAI | Admin Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container" style="max-width: 1200px;">
        <div class="admin-header">
            <h1><i class="fas fa-chart-line"></i> SupportAI Admin Dashboard</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-val" id="totalChats">0</div>
                    <div class="stat-label"><i class="fas fa-comments"></i> Total Chats</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="escalatedChats" style="color: var(--error);">0</div>
                    <div class="stat-label"><i class="fas fa-exclamation-triangle"></i> Escalated</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="activeFilter">All</div>
                    <div class="stat-label"><i class="fas fa-filter"></i> Current View</div>
                </div>
            </div>
        </div>

        <div class="controls" style="display: flex; justify-content: space-between; align-items: center; margin: 2rem 0; background: var(--surface); padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--glass-border);">
            <div class="filter-buttons" style="display: flex; gap: 1rem;">
                <button class="filter-btn active" onclick="filterChats('all')"><i class="fas fa-border-all"></i> All Interactions</button>
                <button class="filter-btn" onclick="filterChats('escalated')"><i class="fas fa-fire"></i> Escalated Only</button>
            </div>
            <div style="display: flex; gap: 1rem;">
                <a href="/" class="button stats-btn" style="text-decoration: none;"><i class="fas fa-arrow-left"></i> Live Chat</a>
                <button class="refresh-btn" onclick="refreshChats()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <div id="chatsContainer">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading analytical data...</div>
        </div>
    </div>

    <script>
        let allChats = [];
        let currentFilter = 'all';
        let autoRefreshInterval;

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadChats();
            startAutoRefresh();
        });

        // Load chat data from API
        async function loadChats() {
            try {
                const response = await fetch('/admin/chats');
                const data = await response.json();
                
                if (data.success) {
                    allChats = data.chats;
                    updateStats(data);
                    renderChats();
                } else {
                    showError('Failed to load chat data');
                }
            } catch (error) {
                console.error('Error loading chats:', error);
                showError('Network error. Please try again.');
            }
        }

        // Update statistics
        function updateStats(data) {
            document.getElementById('totalChats').textContent = data.total_chats;
            document.getElementById('escalatedChats').textContent = data.escalated_chats;
        }

        // Filter chats
        function filterChats(filter) {
            currentFilter = filter;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update filter display
            document.getElementById('activeFilter').textContent = 
                filter === 'all' ? 'All' : 'Escalated';
            
            renderChats();
        }

        // Render chat cards
        function renderChats() {
            const container = document.getElementById('chatsContainer');
            
            // Filter chats
            let filteredChats = allChats;
            if (currentFilter === 'escalated') {
                filteredChats = allChats.filter(chat => chat.escalation === 'Yes');
            }
            
            // Empty state
            if (filteredChats.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No customer interactions yet</h3>
                        <p>Chat data will appear here when customers start using SupportAI.</p>
                    </div>
                `;
                return;
            }
            
            // Render chat cards
            const chatsHTML = filteredChats.map(chat => createChatCard(chat)).join('');
            container.innerHTML = `<div class="chats-grid">${chatsHTML}</div>`;
        }

        // Create individual chat card
        function createChatCard(chat) {
            const isEscalated = chat.escalation === 'Yes';
            const timestamp = formatTimestamp(chat.timestamp);
            const categoryClass = `category-${(chat.category || 'general').toLowerCase()}`;
            const sentimentClass = `sentiment-${(chat.sentiment || 'neutral').toLowerCase()}`;
            
            return `
                <div class="chat-card ${isEscalated ? 'escalated' : ''}">
                    ${isEscalated ? '<div class="escalation-badge">🚨 Escalated</div>' : ''}
                    <div class="chat-query">${escapeHtml(chat.query)}</div>
                    <div class="chat-details">
                        <div class="detail-item">
                            <span class="detail-label">Category:</span>
                            <span class="${categoryClass}">${chat.category || 'General'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Sentiment:</span>
                            <span class="${sentimentClass}">${chat.sentiment || 'Neutral'}</span>
                        </div>
                        ${chat.contact ? `
                        <div class="detail-item">
                            <span class="detail-label">Contact:</span>
                            <span>${escapeHtml(chat.contact)}</span>
                        </div>
                        ` : ''}
                        ${chat.ticket_id ? `
                        <div class="detail-item">
                            <span class="detail-label">Ticket:</span>
                            <span>${escapeHtml(chat.ticket_id)}</span>
                        </div>
                        ` : ''}
                    </div>
                    <div class="timestamp">${timestamp}</div>
                </div>
            `;
        }

        // Format timestamp
        function formatTimestamp(timestamp) {
            if (!timestamp) return 'Unknown time';
            
            try {
                const date = new Date(timestamp);
                return date.toLocaleString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (error) {
                return timestamp;
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Refresh chats manually
        function refreshChats() {
            const btn = event.target;
            btn.textContent = '🔄 Loading...';
            btn.disabled = true;
            
            loadChats().then(() => {
                btn.textContent = '🔄 Refresh';
                btn.disabled = false;
            });
        }

        // Show error message
        function showError(message) {
            const container = document.getElementById('chatsContainer');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        // Start auto-refresh (every 5 seconds)
        function startAutoRefresh() {
            autoRefreshInterval = setInterval(() => {
                loadChats();
            }, 5000);
        }

        // Stop auto-refresh when page is hidden
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                clearInterval(autoRefreshInterval);
            } else {
                startAutoRefresh();
            }
        });
    </script>
</body>
</html>
